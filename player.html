<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>video player</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
        }

        .player_wrapper {
            width: 100%;
            max-width: 960px;
            background: #1a1a1a;
            border-radius: 24px;
            padding: 32px 32px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
            transition: all 0.2s ease;
        }

        .player_title {
            color: #f0f0f0;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-transform: lowercase;
            padding-bottom: 18px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 22px;
            user-select: none;
        }

        .video_container {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #0d0d0d;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video_container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #0d0d0d;
        }

        .video_status {
            color: #888;
            font-size: 13px;
            text-align: center;
            padding-top: 18px;
            letter-spacing: 0.01em;
            font-weight: 400;
            border-top: 1px solid #2a2a2a;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .video_status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a4a4a;
            transition: background 0.3s ease;
            flex-shrink: 0;
        }

        .video_status .dot.active {
            background: #6fcf97;
            box-shadow: 0 0 8px rgba(111, 207, 151, 0.35);
        }

        .video_status .dot.error {
            background: #e74c3c;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.35);
        }

        .video_status .dot.loading {
            background: #f1c40f;
            box-shadow: 0 0 8px rgba(241, 196, 15, 0.35);
            animation: pulse_dot 0.9s ease-in-out infinite alternate;
        }

        @keyframes pulse_dot {
            0% {
                opacity: 0.4;
                transform: scale(0.85);
            }
            100% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        .video_status .status_text {
            color: #b0b0b0;
        }

        .video_status .status_text span {
            color: #e0e0e0;
            font-weight: 450;
        }

        .video_status .meta {
            color: #666;
            font-size: 12px;
            border-left: 1px solid #2a2a2a;
            padding-left: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video_status .meta .badge {
            background: #2a2a2a;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            color: #aaa;
            letter-spacing: 0.04em;
        }

        .video_status .meta .badge.warn {
            background: #3d2e1a;
            color: #d4a86a;
        }

        .video_status .meta .badge.err {
            background: #3d1a1a;
            color: #e68080;
        }

        .video_status .meta .badge.ok {
            background: #1a3d2a;
            color: #80d4a0;
        }

        @media (max-width: 640px) {
            .player_wrapper {
                padding: 18px 16px 18px;
                border-radius: 18px;
            }
            .player_title {
                font-size: 13px;
                padding-bottom: 14px;
                margin-bottom: 16px;
            }
            .video_container {
                border-radius: 12px;
            }
            .video_status {
                font-size: 12px;
                padding-top: 14px;
                margin-top: 16px;
                flex-direction: column;
                gap: 6px;
            }
            .video_status .meta {
                border-left: none;
                padding-left: 0;
            }
        }

        @media (max-width: 400px) {
            .player_wrapper {
                padding: 12px 10px 14px;
                border-radius: 14px;
            }
            .player_title {
                font-size: 12px;
                padding-bottom: 10px;
                margin-bottom: 12px;
            }
            .video_container {
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="player_wrapper">
        <div class="player_title">video player</div>

        <div class="video_container">
            <iframe
                src="https://anym3u8player.com/tv/p.php?url=https%3A%2F%2Fs1.cccdn.net%2F1e7a1bbb64b6f8c0ccd83f0dd310eb33%3A1782154591%2Fpublic_files%2F%2C2026-06%2Fbackrooms_2026_web-dl_english.m4a%2C2026-06%2Fbackrooms_2026_web-dl_spanish-latin-america.m4a%2C2026-06%2Fbackrooms_2026_web-dl_v3_src_360p.mp4%2C2026-06%2Fbackrooms_2026_web-dl_v3_src_720p.mp4%2C2026-06%2Fbackrooms_2026_web-dl_v3_src_1080p.mp4%2C.urlset%2Findex-f5-v1-f1-a1.m3u8"
                allowfullscreen
                allow="autoplay"
                webkitAllowFullScreen
                mozallowfullscreen
            ></iframe>
        </div>

        <div class="video_status">
            <span class="dot active" id="status_dot"></span>
            <span class="status_text" id="status_text">▶ <span>playing</span></span>
            <span class="meta" id="meta_info">
                <span class="badge ok" id="badge_status">live</span>
                <span id="duration_display">--:--</span>
            </span>
        </div>
    </div>

    <script>
        const iframe = document.querySelector('iframe');
        const dot = document.getElementById('status_dot');
        const statusText = document.getElementById('status_text');

        iframe.addEventListener('load', function() {
            dot.className = 'dot active';
            statusText.innerHTML = '▶ <span>playing</span>';
        });
        
        let loaded = false;
        iframe.addEventListener('load', function() { loaded = true; });
        setTimeout(function() {
            if (!loaded) {
                dot.className = 'dot error';
                statusText.innerHTML = '✕ <span>failed to load</span>';
            }
        }, 10000);
    </script>

</body>
</html>
